{% extends "base.html" %}

{% block title %}Giriş yap · Kararsızım{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>Tekrar hoş geldin 👋</h1>
  <p class="muted">Anket açmak için giriş yap. Oy vermek için üyelik gerekmez.</p>

  <form data-auth-form="login" novalidate>
    <p class="form-error" data-error-for="__all__" role="alert" hidden></p>

    <div class="field">
      <label for="identifier">Kullanıcı adı veya e-posta</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" required>
      <p class="field-error" data-error-for="identifier" hidden></p>
    </div>

    <div class="field">
      <label for="password">Parola</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="field-error" data-error-for="password" hidden></p>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Giriş yap</button>
  </form>

  <p class="auth-switch">Hesabın yok mu? <a href="/kayit/" data-keep-next>Kayıt ol</a></p>
</section>
{% endblock %}
