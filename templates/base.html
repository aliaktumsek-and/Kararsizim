{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım{% endblock %}</title>
  <meta name="description" content="Kararsız mı kaldın? Kısa bir anket aç, başkaları oylayarak yardım etsin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" aria-label="Kararsızım ana sayfa">
        <span class="logo-mark" aria-hidden="true">🤔</span>
        <span>Kararsızım</span>
      </a>
      <nav id="auth-nav" class="auth-nav" aria-label="Hesap"></nav>
    </div>
  </header>

  <main id="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
