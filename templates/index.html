{% extends "base.html" %}
{% load static %}

{% block container_class %}container-wide{% endblock %}

{% block content %}
<section aria-labelledby="feed-title">
  <h1 id="feed-title" class="sr-only">Anketler</h1>

  <div class="tabs" role="group" aria-label="Anket sıralaması">
    <button type="button" class="tab" data-sort="new" aria-selected="true">Yeni</button>
    <button type="button" class="tab" data-sort="popular" aria-selected="false">Popüler</button>
  </div>

  <div id="feed" class="feed" aria-live="polite"></div>
  <p id="feed-status" class="feed-status" role="status" hidden></p>
  <div class="feed-more">
    <button id="feed-more" type="button" class="btn btn-ghost btn-outline" hidden>Daha fazla yükle</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/vote.js' %}"></script>
<script src="{% static 'js/poll-card.js' %}"></script>
<script src="{% static 'js/feed.js' %}"></script>
{% endblock %}
