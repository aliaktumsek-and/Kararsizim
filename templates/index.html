{% extends "base.html" %}
{% load static %}

{% block content %}
<section aria-labelledby="feed-title">
  <h1 id="feed-title" class="feed-title">Kararsız kalanlar 🤔</h1>
  <p class="muted">Bir anket seç, karar vermelerine yardım et.</p>

  <div id="feed" class="feed" aria-live="polite"></div>
  <p id="feed-status" class="feed-status" role="status" hidden></p>
  <div class="feed-more">
    <button id="feed-more" type="button" class="btn btn-ghost btn-outline" hidden>Daha fazla yükle</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/vote.js' %}"></script>
<script src="{% static 'js/feed.js' %}"></script>
{% endblock %}
